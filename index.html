<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shadow Delivery - Pro Edition</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            background: #09090b;
            color: #f4f4f5;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        canvas {
            background: #121215;
            display: block;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
            border-radius: 12px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const WIDTH = 400;
const HEIGHT = 600;
canvas.width = WIDTH;
canvas.height = HEIGHT;

function resize() {
    const scale = Math.min(window.innerWidth / WIDTH, window.innerHeight / HEIGHT);
    canvas.style.width = WIDTH * scale + 'px';
    canvas.style.height = HEIGHT * scale + 'px';
}
window.addEventListener('resize', resize);
resize();

// Pelitilat
const STATES = { TUTORIAL: 0, PLAYING: 1, GAMEOVER: 2, WIN: 3 };
let gameState = STATES.TUTORIAL;

let level = 1;
let maxLevels = 5;
let highScore = localStorage.getItem('shadowDeliveryProHigh') || 1;

// Pelaaja
let player = {
    x: 50,
    y: 520,
    radius: 12,
    speed: 3,
    color: '#38bdf8'
};

// Joystick-ohjaus
let joystick = {
    active: false,
    startX: 0,
    startY: 0,
    x: 0,
    y: 0,
    forceX: 0,
    forceY: 0,
    radius: 40
};

// Pelimaailman elementit
let walls = [];
let guards = [];
let packages = [];
let exitZone = { x: 330, y: 520, radius: 25, active: false };

// Tason lataus
function loadLevel(lvl) {
    walls = [];
    guards = [];
    packages = [];
    
    // Jokaisella tasolla erilaisia seiniä ja vartijoita
    if (lvl === 1) {
        walls = [
            { x: 120, y: 150, w: 30, h: 250 },
            { x: 240, y: 200, w: 30, h: 250 }
        ];
        guards = [
            { x: 180, y: 100, vx: 2, minX: 80, maxX: 320, radius: 10, angle: 0, spread: 0.5, length: 110 }
        ];
        packages = [{ x: 340, y: 80, radius: 10, collected: false }];
        exitZone = { x: 50, y: 80, radius: 22, active: true };
        player.x = 50; player.y = 520;
    } else if (lvl === 2) {
        walls = [
            { x: 80, y: 120, w: 240, h: 25 },
            { x: 80, y: 350, w: 240, h: 25 }
        ];
        guards = [
            { x: 200, y: 200, vx: 0, vy: 2, minY: 150, maxY: 300, radius: 10, angle: Math.PI/2, spread: 0.6, length: 120 },
            { x: 100, y: 450, vx: 2.5, minX: 50, maxX: 350, radius: 10, angle: 0, spread: 0.5, length: 100 }
        ];
        packages = [{ x: 200, y: 80, radius: 10, collected: false }];
        exitZone = { x: 350, y: 520, radius: 22, active: true };
        player.x = 50; player.y = 520;
    } else {
        // Vaativammat satunnaistetut tasot
        walls = [
            { x: 50, y: 150, w: 100, h: 30 },
            { x: 250, y: 250, w: 100, h: 30 },
            { x: 120, y: 380, w: 160, h: 30 }
        ];
        guards = [
            { x: 100, y: 220, vx: 2, minX: 50, maxX: 350, radius: 10, angle: 0, spread: 0.5, length: 120 },
            { x: 300, y: 450, vx: -2.5, minX: 50, maxX: 350, radius: 10, angle: Math.PI, spread: 0.5, length: 120 }
        ];
        packages = [{ x: 200, y: 100, radius: 10, collected: false }];
        exitZone = { x: 350, y: 520, radius: 22, active: true };
        player.x = 50; player.y = 520;
    }
}

// Kosketus- ja hiiriohjaus Joystickille
window.addEventListener('pointerdown', (e) => {
    const rect = canvas.getBoundingClientRect();
    const clientX = e.clientX - rect.left;
    const clientY = e.clientY - rect.top;

    if (gameState === STATES.TUTORIAL) {
        gameState = STATES.PLAYING;
        loadLevel(level);
        return;
    }
    if (gameState === STATES.GAMEOVER || gameState === STATES.WIN) {
        if (gameState === STATES.WIN && level <= maxLevels) {
            // Jatketaan seuraavaan tasoon
        } else {
            level = 1;
        }
        gameState = STATES.PLAYING;
        loadLevel(level);
        return;
    }

    // Aktivoi joystick näytön alaosasta
    joystick.active = true;
    joystick.startX = clientX;
    joystick.startY = clientY;
    joystick.x = clientX;
    joystick.y = clientY;
    joystick.forceX = 0;
    joystick.forceY = 0;
});

window.addEventListener('pointermove', (e) => {
    if (!joystick.active) return;
    const rect = canvas.getBoundingClientRect();
    const clientX = e.clientX - rect.left;
    const clientY = e.clientY - rect.top;

    let dx = clientX - joystick.startX;
    let dy = clientY - joystick.startY;
    let dist = Math.hypot(dx, dy);

    if (dist > joystick.radius) {
        dx = (dx / dist) * joystick.radius;
        dy = (dy / dist) * joystick.radius;
    }

    joystick.x = joystick.startX + dx;
    joystick.y = joystick.startY + dy;
    joystick.forceX = dx / joystick.radius;
    joystick.forceY = dy / joystick.radius;
});

window.addEventListener('pointerup', () => {
    joystick.active = false;
    joystick.forceX = 0;
    joystick.forceY = 0;
});

// Törmäystarkistus seinien kanssa (AABB)
function checkWallCollision(nx, ny) {
    for (let w of walls) {
        if (
            nx + player.radius > w.x &&
            nx - player.radius < w.x + w.w &&
            ny + player.radius > w.y &&
            ny - player.radius < w.y + w.h
        ) {
            return true;
        }
    }
    return false;
}

function update() {
    if (gameState !== STATES.PLAYING) return;

    // Liikuta pelaajaa joystickin mukaan
    if (joystick.active) {
        let nextX = player.x + joystick.forceX * player.speed;
        let nextY = player.y + joystick.forceY * player.speed;

        // Tarkista seinät erikseen X- ja Y-akseleilla sulavaa liukua varten
        if (!checkWallCollision(nextX, player.y)) {
            player.x = nextX;
        }
        if (!checkWallCollision(player.x, nextY)) {
            player.y = nextY;
        }
    }

    // Rajat
    player.x = Math.max(player.radius, Math.min(WIDTH - player.radius, player.x));
    player.y = Math.max(player.radius, Math.min(HEIGHT - player.radius, player.y));

    // Päivitä vartijat ja valokeilat
    guards.forEach(g => {
        if (g.vx) {
            g.x += g.vx;
            if (g.x < g.minX || g.x > g.maxX) g.vx *= -1;
        }
        if (g.vy) {
            g.y += g.vy;
            if (g.y < g.minY || g.y > g.maxY) g.vy *= -1;
        }
        g.angle += 0.02;

        // Vartijan valokeilan osuvuus pelaajaan
        let dx = player.x - g.x;
        let dy = player.y - g.y;
        let dist = Math.hypot(dx, dy);

        if (dist < g.length) {
            let angleToPlayer = Math.atan2(dy, dx);
            let angleDiff = Math.abs(normalizeAngle(angleToPlayer - g.angle));
            if (angleDiff < g.spread / 2) {
                // Valo osui! Vartija nappasi kiinni
                gameState = STATES.GAMEOVER;
            }
        }
    });

    // Kerää paketit
    packages.forEach(pkg => {
        if (!pkg.collected) {
            let dist = Math.hypot(player.x - pkg.x, player.y - pkg.y);
            if (dist < player.radius + pkg.radius) {
                pkg.collected = true;
                exitZone.active = true;
            }
        }
    });

    // Tarkista maali (Exit)
    let allCollected = packages.every(p => p.collected);
    if (allCollected && exitZone.active) {
        let distToExit = Math.hypot(player.x - exitZone.x, player.y - exitZone.y);
        if (distToExit < player.radius + exitZone.radius) {
            // Taso läpäisty!
            if (level < maxLevels) {
                level++;
                if (level > highScore) {
                    highScore = level;
                    localStorage.setItem('shadowDeliveryProHigh', highScore);
                }
                loadLevel(level);
            } else {
                gameState = STATES.WIN;
            }
        }
    }
}

function normalizeAngle(angle) {
    while (angle > Math.PI) angle -= Math.PI * 2;
    while (angle < -Math.PI) angle += Math.PI * 2;
    return angle;
}

function draw() {
    ctx.clearRect(0, 0, WIDTH, HEIGHT);

    // Piirrä seinät / rakennukset
    ctx.fillStyle = '#27272a';
    ctx.strokeStyle = '#3f3f46';
    ctx.lineWidth = 2;
    walls.forEach(w => {
        ctx.fillRect(w.x, w.y, w.w, w.h);
        ctx.strokeRect(w.x, w.y, w.w, w.h);
    });

    // Piirrä vartijoiden valokeilat
    guards.forEach(g => {
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(g.x, g.y);
        ctx.arc(g.x, g.y, g.length, g.angle - g.spread / 2, g.angle + g.spread / 2);
        ctx.lineTo(g.x, g.y);
        ctx.fillStyle = 'rgba(239, 68, 68, 0.15)';
        ctx.fill();
        ctx.restore();

        // Vartija itse
        ctx.fillStyle = '#ef4444';
        ctx.beginPath();
        ctx.arc(g.x, g.y, g.radius, 0, Math.PI * 2);
        ctx.fill();
    });

    // Piirrä paketit
    packages.forEach(pkg => {
        if (!pkg.collected) {
            ctx.fillStyle = '#f59e0b';
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#f59e0b';
            ctx.fillRect(pkg.x - pkg.radius, pkg.y - pkg.radius, pkg.radius * 2, pkg.radius * 2);
            ctx.shadowBlur = 0;
        }
    });

    // Piirrä maali / poistumisalue
    let allCollected = packages.every(p => p.collected);
    ctx.fillStyle = allCollected ? '#10b981' : '#3f3f46';
    ctx.beginPath();
    ctx.arc(exitZone.x, exitZone.y, exitZone.radius, 0, Math.PI * 2);
    ctx.fill();

    // Piirrä pelaaja
    ctx.fillStyle = player.color;
    ctx.shadowBlur = 12;
    ctx.shadowColor = player.color;
    ctx.beginPath();
    ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;

    // Piirrä Joystick, jos aktiivinen
    if (joystick.active) {
        ctx.beginPath();
        ctx.arc(joystick.startX, joystick.startY, joystick.radius, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
        ctx.fill();
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(joystick.x, joystick.y, 20, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(56, 189, 248, 0.5)';
        ctx.fill();
    }

    // Yläpalkin tekstit
    if (gameState === STATES.PLAYING) {
        ctx.fillStyle = '#f4f4f5';
        ctx.font = 'bold 16px sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText(`Taso: ${level} / ${maxLevels}`, 20, 30);
        ctx.fillText(allCollected ? 'Hakeudu vihreään maaliin!' : 'Kerää oranssi paketti!', 20, 55);
    }

    // Tutoriaali / Aloitusruutu
    if (gameState === STATES.TUTORIAL) {
        ctx.fillStyle = 'rgba(9, 9, 11, 0.9)';
        ctx.fillRect(0, 0, WIDTH, HEIGHT);

        ctx.fillStyle = '#38bdf8';
        ctx.font = 'bold 26px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('SHADOW DELIVERY', WIDTH / 2, HEIGHT / 2 - 100);

        ctx.fillStyle = '#d4d4d8';
        ctx.font = '15px sans-serif';
        ctx.fillText('1. Käytä ruudulla ilmestyvää joystickiä liikkumiseen.', WIDTH / 2, HEIGHT / 2 - 40);
        ctx.fillText('2. Vältä punaisten vartijoiden valokeiloja.', WIDTH / 2, HEIGHT / 2 - 10);
        ctx.fillText('3. Kerää paketti ja pakene vihreään maaliin.', WIDTH / 2, HEIGHT / 2 + 20);

        ctx.fillStyle = '#f4f4f5';
        ctx.font = 'bold 16px sans-serif';
        ctx.fillText('Napauta aloittaaksesi', WIDTH / 2, HEIGHT / 2 + 90);
    }

    // Game Over -ruutu
    if (gameState === STATES.GAMEOVER) {
        ctx.fillStyle = 'rgba(9, 9, 11, 0.9)';
        ctx.fillRect(0, 0, WIDTH, HEIGHT);

        ctx.fillStyle = '#ef4444';
        ctx.font = 'bold 30px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('KIINNITTE! VALO OSI', WIDTH / 2, HEIGHT / 2 - 30);

        ctx.fillStyle = '#38bdf8';
        ctx.font = 'bold 16px sans-serif';
        ctx.fillText('Napauta yrittääksesi uudelleen', WIDTH / 2, HEIGHT / 2 + 30);
    }

    // Voittoruutu
    if (gameState === STATES.WIN) {
        ctx.fillStyle = 'rgba(9, 9, 11, 0.95)';
        ctx.fillRect(0, 0, WIDTH, HEIGHT);

        ctx.fillStyle = '#10b981';
        ctx.font = 'bold 30px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('KAIKKI TASOT LÄPÄISTY! 🎉', WIDTH / 2, HEIGHT / 2 - 30);

        ctx.fillStyle = '#38bdf8';
        ctx.font = 'bold 16px sans-serif';
        ctx.fillText('Napauta pelataksesi uudelleen', WIDTH / 2, HEIGHT / 2 + 30);
    }
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
