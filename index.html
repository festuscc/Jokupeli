<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shadow Delivery - Cyberpunk Edition</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        body {
            margin: 0;
            padding: 0;
            background: #05050a;
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        #gameContainer {
            position: relative;
            width: 400px;
            height: 600px;
            box-shadow: 0 0 40px rgba(0, 240, 255, 0.15);
            border-radius: 16px;
            overflow: hidden;
            background: #090916;
            border: 2px solid rgba(0, 240, 255, 0.2);
        }
        canvas {
            display: block;
        }
        /* HTML-pohjaiset tyylikkäät UI-kerrokset */
        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 5, 10, 0.92);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            z-index: 10;
            text-align: center;
        }
        .hidden {
            display: none !important;
        }
        h1 {
            color: #00f0ff;
            font-size: 28px;
            margin: 0 0 10px 0;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
            letter-spacing: 2px;
        }
        p {
            color: #94a3b8;
            font-size: 14px;
            margin: 0 0 20px 0;
            line-height: 1.5;
        }
        .btn {
            background: linear-gradient(135deg, #00f0ff, #0077ff);
            color: #000;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 240, 255, 0.4);
            margin: 8px 0;
            width: 100%;
            max-width: 280px;
            transition: transform 0.1s;
        }
        .btn:active {
            transform: scale(0.96);
        }
        .btn-secondary {
            background: linear-gradient(135deg, #ff007f, #7000ff);
            box-shadow: 0 4px 15px rgba(255, 0, 127, 0.4);
            color: #fff;
        }
        .input-group {
            display: flex;
            gap: 8px;
            width: 100%;
            max-width: 280px;
            margin: 10px 0;
        }
        input {
            flex: 1;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 12px;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            outline: none;
            text-align: center;
        }
        input:focus {
            border-color: #00f0ff;
        }
        .shop-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            max-width: 280px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

<div id="gameContainer">
    <canvas id="gameCanvas" width="400" height="600"></canvas>

    <!-- TUTORIAL / ALOITUS -->
    <div id="tutorialScreen" class="overlay">
        <h1>SHADOW DELIVERY</h1>
        <p>Hiivi futuristisessa kaupungissa, vältä vartijoiden valoja, kerää paketit ja pakene maaliin!</p>
        <button class="btn" onclick="startGame()">ALOITA PELI</button>
    </div>

    <!-- KAUPPA / TASOJEN VÄLI -->
    <div id="shopScreen" class="overlay hidden">
        <h1>MUSTAN PÖRSSIN KAUPPA</h1>
        <p id="shopCoins">Kolikot: 🪙 0</p>
        
        <div class="shop-grid">
            <button class="btn" id="speedBtn" onclick="buySpeed()">Päivitä nopeus (25🪙)</button>
            <button class="btn btn-secondary" onclick="buySkin('neon')">Neon Vihreä (50🪙)</button>
            <button class="btn btn-secondary" onclick="buySkin('gold')">Kultainen (100🪙)</button>
            <button class="btn btn-secondary" onclick="buySkin('ninja')">Cyber-Ninja (150🪙)</button>
            <button class="btn btn-secondary" style="background: linear-gradient(135deg, #d4a373, #bc6c25);" onclick="buySkin('nakkari')">Näkkäri 🍞 (250🪙)</button>
        </div>

        <div class="input-group">
            <input type="text" id="adminCodeInput" placeholder="Admin-koodi">
            <button class="btn" style="width: auto; padding: 0 16px;" onclick="checkAdminCode()">OK</button>
        </div>

        <button class="btn" style="background: #10b981; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);" onclick="nextLevel()">JATKA SEURAAVAAN TASOON</button>
    </div>

    <!-- GAME OVER -->
    <div id="gameOverScreen" class="overlay hidden">
        <h1 style="color: #ff0055;">VALO OSUI!</h1>
        <p>Vartija havaitsi sinut. Kokeile uudelleen!</p>
        <button class="btn" onclick="retryLevel()">YRITÄ UUDELLEEN</button>
    </div>

    <!-- WIN SCREEN -->
    <div id="winScreen" class="overlay hidden">
        <h1 style="color: #10b981;">TEHTÄVÄ SUORITETTU!</h1>
        <p>Läpäisit kaikki pääsyn haasteet! Olet todellinen varjokuriiri.</p>
        <button class="btn" onclick="restartGame()">PELAA UUDESTAAN</button>
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const WIDTH = 400;
const HEIGHT = 600;

// Tallennusmuuttujat
let level = parseInt(localStorage.getItem('sd_level')) || 1;
let coins = parseInt(localStorage.getItem('sd_coins')) || 0;
let speedLevel = parseInt(localStorage.getItem('sd_speedLvl')) || 1;
let unlockedSkins = JSON.parse(localStorage.getItem('sd_skins')) || ['default'];
let equippedSkin = localStorage.getItem('sd_equipped') || 'default';

let player = {
    x: 50, y: 520, radius: 12,
    get speed() { return 2.6 + (speedLevel * 0.35); }
};

let joystick = {
    active: false, pointerId: null,
    startX: 0, startY: 0, x: 0, y: 0, forceX: 0, forceY: 0, radius: 45
};

let walls = [];
let guards = [];
let packages = [];
let exitZone = { x: 330, y: 520, radius: 24, active: false };

const skins = {
    'default': { name: 'Perus Sininen', color: '#00f0ff' },
    'neon': { name: 'Neon Vihreä', color: '#10b981', price: 50 },
    'gold': { name: 'Kultainen', color: '#f59e0b', price: 100 },
    'ninja': { name: 'Cyber-Ninja', color: '#a855f7', price: 150 },
    'nakkari': { name: 'Näkkäri 🍞', color: '#d4a373', price: 250 }
};

// Tasokohtaiset taustavärit ja teemat
const levelThemes = [
    { bg: '#090916', grid: 'rgba(0, 240, 255, 0.03)', wall: '#1e1b4b', border: '#312e81' },
    { bg: '#110516', grid: 'rgba(255, 0, 127, 0.03)', wall: '#4a044e', border: '#701a75' },
    { bg: '#022c22', grid: 'rgba(16, 185, 129, 0.03)', wall: '#064e3b', border: '#065f46' },
    { bg: '#2e1065', grid: 'rgba(168, 85, 247, 0.03)', wall: '#581c87', border: '#6b21a8' },
    { bg: '#451a03', grid: 'rgba(245, 158, 11, 0.03)', wall: '#78350f', border: '#92400e' }
];

function saveGame() {
    localStorage.setItem('sd_level', level);
    localStorage.setItem('sd_coins', coins);
    localStorage.setItem('sd_speedLvl', speedLevel);
    localStorage.setItem('sd_skins', JSON.stringify(unlockedSkins));
    localStorage.setItem('sd_equipped', equippedSkin);
}

// Generoi aina täysin uuden tason
function generateLevel(lvl) {
    walls = [];
    guards = [];
    packages = [];

    // Kasvava vaikeustaso ja dynaamiset rakenteet
    let wallCount = 2 + Math.floor(lvl / 2);
    for (let i = 0; i < wallCount; i++) {
        let w = 70 + Math.random() * 80;
        let h = 20;
        let x = 30 + Math.random() * (WIDTH - w - 60);
        let y = 100 + i * (350 / wallCount) + Math.random() * 40;
        walls.push({ x, y, w, h });
    }

    let guardCount = Math.min(1 + Math.floor(lvl / 2), 5);
    for (let i = 0; i < guardCount; i++) {
        guards.push({
            x: 60 + Math.random() * 280,
            y: 90 + i * 90,
            vx: (Math.random() > 0.5 ? 1.5 : -1.5) * (1 + lvl * 0.08),
            vy: lvl > 3 && i % 2 === 0 ? (Math.random() > 0.5 ? 1 : -1) * 1.2 : 0,
            minX: 30, maxX: 370,
            minY: 80, maxY: 480,
            radius: 10,
            angle: Math.random() * Math.PI * 2,
            spread: 0.5 + Math.min(lvl * 0.02, 0.3),
            length: 100 + Math.min(lvl * 5, 40),
            color: ['#ff0055', '#ff9900', '#bf00ff', '#00ffcc'][i % 4]
        });
    }

    let pkgCount = Math.min(1 + Math.floor(lvl / 3), 3);
    for (let i = 0; i < pkgCount; i++) {
        packages.push({
            x: 60 + Math.random() * 280,
            y: 70 + Math.random() * 400,
            radius: 11,
            collected: false
        });
    }

    exitZone = { x: 330, y: 540, radius: 24, active: false };
    player.x = 50; 
    player.y = 550;
}

// UI-toiminnot
function startGame() {
    document.getElementById('tutorialScreen').classList.add('hidden');
    generateLevel(level);
    requestAnimationFrame(loop);
}

function nextLevel() {
    level++;
    saveGame();
    document.getElementById('shopScreen').classList.add('hidden');
    generateLevel(level);
}

function retryLevel() {
    document.getElementById('gameOverScreen').classList.add('hidden');
    generateLevel(level);
}

function restartGame() {
    level = 1;
    saveGame();
    document.getElementById('winScreen').classList.add('hidden');
    generateLevel(level);
}

function openShop() {
    document.getElementById('shopCoins').innerText = `Kolikot: 🪙 ${coins}`;
    document.getElementById('speedBtn').innerText = `Päivitä nopeus (Taso ${speedLevel}): ${speedLevel * 25}🪙`;
    document.getElementById('shopScreen').classList.remove('hidden');
}

function buySpeed() {
    let cost = speedLevel * 25;
    if (coins >= cost) {
        coins -= cost;
        speedLevel++;
        saveGame();
        openShop();
    } else {
        alert("Ei tarpeeksi kolikoita!");
    }
}

function buySkin(skinKey) {
    let skin = skins[skinKey];
    if (unlockedSkins.includes(skinKey)) {
        equippedSkin = skinKey;
        saveGame();
        alert(`Otettu käyttöön: ${skin.name}`);
    } else if (coins >= skin.price) {
        coins -= skin.price;
        unlockedSkins.push(skinKey);
        equippedSkin = skinKey;
        saveGame();
        openShop();
        alert(`Ostettu ja otettu käyttöön: ${skin.name}!`);
    } else {
        alert("Ei tarpeeksi kolikoita!");
    }
}

function checkAdminCode() {
    let code = document.getElementById('adminCodeInput').value.trim();
    if (code.toUpperCase() === "NAKKARI") {
        if (!unlockedSkins.includes('nakkari')) unlockedSkins.push('nakkari');
        equippedSkin = 'nakkari';
        saveGame();
        openShop();
        alert("Admin-koodi hyväksytty! Legendaarinen Näkkäri-skini avattu! 🍞🔥");
        document.getElementById('adminCodeInput').value = '';
    } else {
        alert("Väärä koodi!");
    }
}

// Touch / Joystick tapahtumat
canvas.addEventListener('pointerdown', (e) => {
    const rect = canvas.getBoundingClientRect();
    const clientX = e.clientX - rect.left;
    const clientY = e.clientY - rect.top;

    if (!joystick.active) {
        joystick.active = true;
        joystick.pointerId = e.pointerId;
        joystick.startX = clientX;
        joystick.startY = clientY;
        joystick.x = clientX;
        joystick.y = clientY;
        joystick.forceX = 0;
        joystick.forceY = 0;
        canvas.setPointerCapture(e.pointerId);
    }
});

canvas.addEventListener('pointermove', (e) => {
    if (!joystick.active || e.pointerId !== joystick.pointerId) return;
    const rect = canvas.getBoundingClientRect();
    const clientX = e.clientX - rect.left;
    const clientY = e.clientY - rect.top;

    let dx = clientX - joystick.startX;
    let dy = clientY - joystick.startY;
    let dist = Math.hypot(dx, dy);

    if (dist > joystick.radius) {
        dx = (dx / dist) * joystick.radius;
        dy = (dy / dist) * joystick.radius;
    }

    joystick.x = joystick.startX + dx;
    joystick.y = joystick.startY + dy;
    joystick.forceX = dx / joystick.radius;
    joystick.forceY = dy / joystick.radius;
});

function endJoystick(e) {
    if (joystick.active && e.pointerId === joystick.pointerId) {
        joystick.active = false;
        joystick.pointerId = null;
        joystick.forceX = 0;
        joystick.forceY = 0;
    }
}
canvas.addEventListener('pointerup', endJoystick);
canvas.addEventListener('pointercancel', endJoystick);

function checkWallCollision(nx, ny) {
    for (let w of walls) {
        if (
            nx + player.radius > w.x &&
            nx - player.radius < w.x + w.w &&
            ny + player.radius > w.y &&
            ny - player.radius < w.y + w.h
        ) {
            return true;
        }
    }
    return false;
}

function update() {
    if (joystick.active) {
        let nextX = player.x + joystick.forceX * player.speed;
        let nextY = player.y + joystick.forceY * player.speed;

        if (!checkWallCollision(nextX, player.y)) player.x = nextX;
        if (!checkWallCollision(player.x, nextY)) player.y = nextY;
    }

    player.x = Math.max(player.radius, Math.min(WIDTH - player.radius, player.x));
    player.y = Math.max(player.radius, Math.min(HEIGHT - player.radius, player.y));

    // Vartijoiden liike ja kulmat
    guards.forEach(g => {
        g.x += g.vx;
        if (g.x < g.minX || g.x > g.maxX) g.vx *= -1;
        if (g.vy) {
            g.y += g.vy;
            if (g.y < g.minY || g.y > g.maxY) g.vy *= -1;
        }
        g.angle += 0.025;

        let dx = player.x - g.x;
        let dy = player.y - g.y;
        let dist = Math.hypot(dx, dy);

        if (dist < g.length) {
            let angleToPlayer = Math.atan2(dy, dx);
            let angleDiff = Math.abs(normalizeAngle(angleToPlayer - g.angle));
            if (angleDiff < g.spread / 2) {
                document.getElementById('gameOverScreen').classList.remove('hidden');
                joystick.active = false;
            }
        }
    });

    // Paketit
    packages.forEach(pkg => {
        if (!pkg.collected) {
            let dist = Math.hypot(player.x - pkg.x, player.y - pkg.y);
            if (dist < player.radius + pkg.radius) {
                pkg.collected = true;
                coins += 15;
                saveGame();
                if (packages.every(p => p.collected)) {
                    exitZone.active = true;
                }
            }
        }
    });

    // Maaliin pääsy -> Avaa kauppa
    let allCollected = packages.every(p => p.collected);
    if (allCollected && exitZone.active) {
        let distToExit = Math.hypot(player.x - exitZone.x, player.y - exitZone.y);
        if (distToExit < player.radius + exitZone.radius) {
            if (level >= 5) {
                document.getElementById('winScreen').classList.remove('hidden');
            } else {
                openShop();
            }
        }
    }
}

function normalizeAngle(angle) {
    while (angle > Math.PI) angle -= Math.PI * 2;
    while (angle < -Math.PI) angle += Math.PI * 2;
    return angle;
}

function draw() {
    let theme = levelThemes[(level - 1) % levelThemes.length];

    // Tausta ja ruudukko
    ctx.fillStyle = theme.bg;
    ctx.fillRect(0, 0, WIDTH, HEIGHT);

    ctx.strokeStyle = theme.grid;
    ctx.lineWidth = 1;
    for (let x = 0; x < WIDTH; x += 30) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, HEIGHT); ctx.stroke();
    }
    for (let y = 0; y < HEIGHT; y += 30) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(WIDTH, y); ctx.stroke();
    }

    // Seinät
    ctx.fillStyle = theme.wall;
    ctx.strokeStyle = theme.border;
    ctx.lineWidth = 2;
    walls.forEach(w => {
        ctx.fillRect(w.x, w.y, w.w, w.h);
        ctx.strokeRect(w.x, w.y, w.w, w.h);
    });

    // Vartijoiden valokeilat
    guards.forEach(g => {
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(g.x, g.y);
        ctx.arc(g.x, g.y, g.length, g.angle - g.spread / 2, g.angle + g.spread / 2);
        ctx.lineTo(g.x, g.y);
        ctx.fillStyle = 'rgba(255, 0, 85, 0.12)';
        ctx.fill();
        ctx.restore();

        ctx.fillStyle = g.color;
        ctx.beginPath();
        ctx.arc(g.x, g.y, g.radius, 0, Math.PI * 2);
        ctx.fill();
    });

    // Paketit
    packages.forEach(pkg => {
        if (!pkg.collected) {
            ctx.fillStyle = '#f59e0b';
            ctx.shadowBlur = 12;
            ctx.shadowColor = '#f59e0b';
            ctx.fillRect(pkg.x - pkg.radius, pkg.y - pkg.radius, pkg.radius * 2, pkg.radius * 2);
            ctx.shadowBlur = 0;
        }
    });

    // Maali
    let allCollected = packages.every(p => p.collected);
    ctx.fillStyle = allCollected ? '#10b981' : '#27272a';
    ctx.shadowBlur = allCollected ? 15 : 0;
    ctx.shadowColor = '#10b981';
    ctx.beginPath();
    ctx.arc(exitZone.x, exitZone.y, exitZone.radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;

    // Pelaaja ja skinit
    let skinColor = skins[equippedSkin].color;
    ctx.fillStyle = skinColor;
    ctx.shadowBlur = 15;
    ctx.shadowColor = skinColor;
    if (equippedSkin === 'nakkari') {
        ctx.fillRect(player.x - player.radius, player.y - player.radius, player.radius * 2, player.radius * 2);
    } else {
        ctx.beginPath();
        ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.shadowBlur = 0;

    // Joystick
    if (joystick.active) {
        ctx.beginPath();
        ctx.arc(joystick.startX, joystick.startY, joystick.radius, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
        ctx.fill();
        ctx.strokeStyle = 'rgba(0, 240, 255, 0.2)';
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(joystick.x, joystick.y, 22, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(0, 240, 255, 0.6)';
        ctx.fill();
    }

    // HUD yläpalkki
    ctx.fillStyle = '#f8fafc';
    ctx.font = 'bold 15px sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(`Taso: ${level}/5 | 🪙 ${coins}`, 20, 30);
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}
</script>

</body>
</html>
