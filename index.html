<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shadow Delivery - Ultimate Edition</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        body {
            margin: 0;
            padding: 0;
            background: #05050a;
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        #gameContainer {
            position: relative;
            width: 400px;
            height: 600px;
            box-shadow: 0 0 40px rgba(0, 240, 255, 0.2);
            border-radius: 16px;
            overflow: hidden;
            background: #090916;
            border: 2px solid rgba(0, 240, 255, 0.3);
        }
        canvas {
            display: block;
        }
        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 5, 10, 0.94);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            z-index: 10;
            text-align: center;
        }
        .hidden {
            display: none !important;
        }
        h1 {
            color: #00f0ff;
            font-size: 26px;
            margin: 0 0 8px 0;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
            letter-spacing: 1px;
        }
        p {
            color: #cbd5e1;
            font-size: 13px;
            margin: 0 0 15px 0;
            line-height: 1.4;
        }
        .btn {
            background: linear-gradient(135deg, #00f0ff, #0077ff);
            color: #000;
            border: none;
            padding: 12px 24px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 240, 255, 0.4);
            margin: 6px 0;
            width: 100%;
            max-width: 280px;
        }
        .btn:active {
            transform: scale(0.96);
        }
        .btn-secondary {
            background: linear-gradient(135deg, #ff007f, #7000ff);
            box-shadow: 0 4px 15px rgba(255, 0, 127, 0.4);
            color: #fff;
        }
        .input-group {
            display: flex;
            gap: 8px;
            width: 100%;
            max-width: 280px;
            margin: 8px 0;
        }
        input {
            flex: 1;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 10px;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            outline: none;
            text-align: center;
        }
        .shop-grid {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
            max-width: 280px;
            margin-bottom: 12px;
        }
    </style>
</head>
<body>

<div id="gameContainer">
    <canvas id="gameCanvas" width="400" height="600"></canvas>

    <!-- TUTORIAL / ALOITUS -->
    <div id="tutorialScreen" class="overlay">
        <h1>SHADOW DELIVERY</h1>
        <p><b>Tervetuloa tutoriaaliin!</b><br>1. Ohjaa hahmoa raahaamalla näyttöä.<br>2. Vältä vartijoiden valoja (valot eivät näy seinien läpi!).<br>3. Kerää kaikki paketit ja siirry vihreään maaliin.</p>
        <button class="btn" onclick="setMode('classic')">Klassinen pelimuoto</button>
        <button class="btn btn-secondary" onclick="setMode('speedrun')">Aika-ajo (Speedrun)</button>
    </div>

    <!-- KAUPPA -->
    <div id="shopScreen" class="overlay hidden">
        <h1>KAUPPA & PÄIVITYKSET</h1>
        <p id="shopCoins">Kolikot: 🪙 0</p>
        
        <div class="shop-grid">
            <button class="btn" id="speedBtn" onclick="buySpeed()">Päivitä nopeus (25🪙)</button>
            <button class="btn" id="lifeBtn" onclick="buyLife()">Osta lisäelämä (50🪙)</button>
            <button class="btn btn-secondary" onclick="buySkin('neon')">Neon Vihreä (50🪙)</button>
            <button class="btn btn-secondary" onclick="buySkin('gold')">Kultainen (100🪙)</button>
            <button class="btn btn-secondary" style="background: linear-gradient(135deg, #d4a373, #bc6c25);" onclick="buySkin('nakkari')">Näkkäri 🍞 (250🪙)</button>
        </div>

        <div class="input-group">
            <input type="text" id="adminCodeInput" placeholder="Admin-koodi">
            <button class="btn" style="width: auto; padding: 0 14px;" onclick="checkAdminCode()">OK</button>
        </div>

        <button class="btn" style="background: #10b981; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);" onclick="nextLevel()">JATKA SEURAAVAAN</button>
    </div>

    <!-- GAME OVER -->
    <div id="gameOverScreen" class="overlay hidden">
        <h1 style="color: #ff0055;">VALO OSUI!</h1>
        <p>Vartija havaitsi sinut.</p>
        <button class="btn" onclick="retryLevel()">YRITÄ UUDELLEEN</button>
    </div>

    <!-- WIN SCREEN -->
    <div id="winScreen" class="overlay hidden">
        <h1 style="color: #10b981;">MAHTAVAA!</h1>
        <p id="winText">Taso läpäisty!</p>
        <button class="btn" onclick="openShopFromWin()">JATKA</button>
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const WIDTH = 400;
const HEIGHT = 600;

let level = parseInt(localStorage.getItem('sd_level')) || 1;
let coins = parseInt(localStorage.getItem('sd_coins')) || 0;
let speedLevel = parseInt(localStorage.getItem('sd_speedLvl')) || 1;
let extraLives = parseInt(localStorage.getItem('sd_lives')) || 0;
let unlockedSkins = JSON.parse(localStorage.getItem('sd_skins')) || ['default'];
let equippedSkin = localStorage.getItem('sd_equipped') || 'default';
let gameMode = 'classic'; // 'classic' tai 'speedrun'
let speedrunTime = 30; // 30 sekuntia aika-ajossa
let timerInterval = null;

let player = {
    x: 50, y: 540, radius: 12,
    get speed() { return 2.4 + (speedLevel * 0.3); }
};

let joystick = {
    active: false, pointerId: null,
    startX: 0, startY: 0, x: 0, y: 0, forceX: 0, forceY: 0, radius: 45
};

let walls = [];
let guards = [];
let packages = [];
let exitZone = { x: 330, y: 540, radius: 24, active: false };

const skins = {
    'default': { name: 'Perus Sininen', color: '#00f0ff' },
    'neon': { name: 'Neon Vihreä', color: '#10b981', price: 50 },
    'gold': { name: 'Kultainen', color: '#f59e0b', price: 100 },
    'nakkari': { name: 'Näkkäri 🍞', color: '#d4a373', price: 250 }
};

function saveGame() {
    localStorage.setItem('sd_level', level);
    localStorage.setItem('sd_coins', coins);
    localStorage.setItem('sd_speedLvl', speedLevel);
    localStorage.setItem('sd_lives', extraLives);
    localStorage.setItem('sd_skins', JSON.stringify(unlockedSkins));
    localStorage.setItem('sd_equipped', equippedSkin);
}

// Pseudorandom seedillä varmistetaan, että sama taso näyttää aina täsmälleen samalta
function seededRandom(seed) {
    let x = Math.sin(seed++) * 10000;
    return x - Math.floor(x);
}

function loadLevel(lvl) {
    walls = [];
    guards = [];
    packages = [];
    
    let isBoss = (lvl % 10 === 0);
    let seed = lvl * 1337;

    // Kunnon rakennukset ja seinät (varmistetaan ettei paketit ole maalin lähellä)
    walls = [
        { x: 60, y: 140, w: 120, h: 24 },
        { x: 220, y: 260, w: 120, h: 24 },
        { x: 100, y: 380, w: 200, h: 24 }
    ];
    if (lvl > 2) {
        walls.push({ x: 50, y: 240, w: 24, h: 100 });
        walls.push({ x: 320, y: 140, w: 24, h: 120 });
    }

    // Vartijoiden määrä (hidastetut ja turvalliset nopeudet)
    let guardCount = isBoss ? 6 : Math.min(1 + Math.floor(lvl / 2), 4);
    for (let i = 0; i < guardCount; i++) {
        guards.push({
            x: 80 + (i * 70) % 260,
            y: 90 + (i * 80) % 280,
            vx: (i % 2 === 0 ? 1.1 : -1.1) * (isBoss ? 1.4 : 1.0),
            vy: lvl > 4 && i % 3 === 0 ? 0.8 : 0,
            minX: 40, maxX: 360,
            minY: 80, maxY: 460,
            radius: 10,
            angle: i * (Math.PI / 2),
            spread: 0.45,
            length: 110,
            color: isBoss ? '#ff0055' : '#ff9900'
        });
    }

    // Paketit (määrä ja sijainti suhteessa tasoon, ei koskaan maalin vieressä)
    let pkgCount = Math.min(1 + Math.floor(lvl / 4), 3);
    for (let i = 0; i < pkgCount; i++) {
        let px = 80 + (seededRandom(seed + i) * 220);
        let py = 70 + (seededRandom(seed + i + 50) * 250);
        // Varmistetaan ettei paketti ole lähellä aloitusta tai maalia (330, 540)
        if (Math.hypot(px - 330, py - 540) < 100) px = 100;
        packages.push({ x: px, y: py, radius: 11, collected: false });
    }

    exitZone = { x: 330, y: 540, radius: 24, active: false };
    player.x = 50; 
    player.y = 540;

    if (gameMode === 'speedrun') {
        speedrunTime = Math.max(15, 35 - lvl);
        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            speedrunTime--;
            if (speedrunTime <= 0) {
                clearInterval(timerInterval);
                document.getElementById('gameOverScreen').classList.remove('hidden');
                joystick.active = false;
            }
        }, 1000);
    }
}

function setMode(mode) {
    gameMode = mode;
    document.getElementById('tutorialScreen').classList.add('hidden');
    loadLevel(level);
    requestAnimationFrame(loop);
}

function nextLevel() {
    level++;
    saveGame();
    document.getElementById('shopScreen').classList.add('hidden');
    loadLevel(level);
}

function openShopFromWin() {
    document.getElementById('winScreen').classList.add('hidden');
    document.getElementById('shopCoins').innerText = `Kolikot: 🪙 ${coins}`;
    document.getElementById('speedBtn').innerText = `Päivitä nopeus (Taso ${speedLevel}): ${speedLevel * 25}🪙`;
    document.getElementById('lifeBtn').innerText = `Lisäelämät: ${extraLives} (Osta 50🪙)`;
    document.getElementById('shopScreen').classList.remove('hidden');
}

function retryLevel() {
    document.getElementById('gameOverScreen').classList.add('hidden');
    loadLevel(level);
}

function buySpeed() {
    let cost = speedLevel * 25;
    if (coins >= cost) {
        coins -= cost;
        speedLevel++;
        saveGame();
        openShopFromWin();
    } else {
        alert("Ei tarpeeksi kolikoita!");
    }
}

function buyLife() {
    if (coins >= 50) {
        coins -= 50;
        extraLives++;
        saveGame();
        openShopFromWin();
    } else {
        alert("Ei tarpeeksi kolikoita! (Vaatii 50🪙)");
    }
}

function buySkin(skinKey) {
    let skin = skins[skinKey];
    if (unlockedSkins.includes(skinKey)) {
        equippedSkin = skinKey;
        saveGame();
        alert(`Käytössä: ${skin.name}`);
    } else if (coins >= skin.price) {
        coins -= skin.price;
        unlockedSkins.push(skinKey);
        equippedSkin = skinKey;
        saveGame();
        openShopFromWin();
        alert(`Ostettu: ${skin.name}!`);
    } else {
        alert("Ei tarpeeksi kolikoita!");
    }
}

function checkAdminCode() {
    let code = document.getElementById('adminCodeInput').value.trim();
    if (code.toUpperCase() === "NAKKARI") {
        if (!unlockedSkins.includes('nakkari')) unlockedSkins.push('nakkari');
        equippedSkin = 'nakkari';
        saveGame();
        openShopFromWin();
        alert("Admin-koodi hyväksytty! Näkkäri-skini avattu! 🍞");
        document.getElementById('adminCodeInput').value = '';
    } else {
        alert("Väärä koodi!");
    }
}

// Kosketus / Joystick
canvas.addEventListener('pointerdown', (e) => {
    const rect = canvas.getBoundingClientRect();
    let clientX = e.clientX - rect.left;
    let clientY = e.clientY - rect.top;

    if (!joystick.active) {
        joystick.active = true;
        joystick.pointerId = e.pointerId;
        joystick.startX = clientX;
        joystick.startY = clientY;
        joystick.x = clientX;
        joystick.y = clientY;
        joystick.forceX = 0;
        joystick.forceY = 0;
        canvas.setPointerCapture(e.pointerId);
    }
});

canvas.addEventListener('pointermove', (e) => {
    if (!joystick.active || e.pointerId !== joystick.pointerId) return;
    const rect = canvas.getBoundingClientRect();
    let clientX = e.clientX - rect.left;
    let clientY = e.clientY - rect.top;

    let dx = clientX - joystick.startX;
    let dy = clientY - joystick.startY;
    let dist = Math.hypot(dx, dy);

    if (dist > joystick.radius) {
        dx = (dx / dist) * joystick.radius;
        dy = (dy / dist) * joystick.radius;
    }

    joystick.x = joystick.startX + dx;
    joystick.y = joystick.startY + dy;
    joystick.forceX = dx / joystick.radius;
    joystick.forceY = dy / joystick.radius;
});

function endJoystick(e) {
    if (joystick.active && e.pointerId === joystick.pointerId) {
        joystick.active = false;
        joystick.pointerId = null;
        joystick.forceX = 0;
        joystick.forceY = 0;
    }
}
canvas.addEventListener('pointerup', endJoystick);
canvas.addEventListener('pointercancel', endJoystick);

function checkWallCollision(nx, ny) {
    for (let w of walls) {
        if (
            nx + player.radius > w.x &&
            nx - player.radius < w.x + w.w &&
            ny + player.radius > w.y &&
            ny - player.radius < w.y + w.h
        ) {
            return true;
        }
    }
    return false;
}

// Raycasting: Tarkistaa näkeekö vartija pelaajan (valokeila pysähtyy seiniin)
function guardCanSeePlayer(g) {
    let dx = player.x - g.x;
    let dy = player.y - g.y;
    let dist = Math.hypot(dx, dy);

    if (dist > g.length) return false;

    let angleToPlayer = Math.atan2(dy, dx);
    let angleDiff = Math.abs(normalizeAngle(angleToPlayer - g.angle));
    if (angleDiff > g.spread / 2) return false;

    // Tarkistetaan osuuko seinä vartijan ja pelaajan väliin
    for (let w of walls) {
        // Yksinkertaistettu säteen tarkistus seinää vasten
        let steps = 10;
        for (let s = 1; s < steps; s++) {
            let checkX = g.x + (dx * (s / steps));
            let checkY = g.y + (dy * (s / steps));
            if (checkX >= w.x && checkX <= w.x + w.w && checkY >= w.y && checkY <= w.y + w.h) {
                return false; // Seinä estää näkyvyyden!
            }
        }
    }
    return true;
}

function update() {
    if (document.getElementById('tutorialScreen').classList.contains('hidden') === false) return;
    if (document.getElementById('shopScreen').classList.contains('hidden') === false) return;
    if (document.getElementById('gameOverScreen').classList.contains('hidden') === false) return;
    if (document.getElementById('winScreen').classList.contains('hidden') === false) return;

    if (joystick.active) {
        let nextX = player.x + joystick.forceX * player.speed;
        let nextY = player.y + joystick.forceY * player.speed;

        if (!checkWallCollision(nextX, player.y)) player.x = nextX;
        if (!checkWallCollision(player.x, nextY)) player.y = nextY;
    }

    player.x = Math.max(player.radius, Math.min(WIDTH - player.radius, player.x));
    player.y = Math.max(player.radius, Math.min(HEIGHT - player.radius, player.y));

    guards.forEach(g => {
        g.x += g.vx;
        if (g.x < g.minX || g.x > g.maxX) g.vx *= -1;
        if (g.vy) {
            g.y += g.vy;
            if (g.y < g.minY || g.y > g.maxY) g.vy *= -1;
        }
        g.angle += 0.015;

        if (guardCanSeePlayer(g)) {
            if (extraLives > 0) {
                extraLives--;
                saveGame();
                player.x = 50; player.y = 540; // Turvaan
            } else {
                clearInterval(timerInterval);
                document.getElementById('gameOverScreen').classList.remove('hidden');
                joystick.active = false;
            }
        }
    });

    packages.forEach(pkg => {
        if (!pkg.collected) {
            let dist = Math.hypot(player.x - pkg.x, player.y - pkg.y);
            if (dist < player.radius + pkg.radius) {
                pkg.collected = true;
                coins += 15;
                saveGame();
                if (packages.every(p => p.collected)) {
                    exitZone.active = true;
                }
            }
        }
    });

    let allCollected = packages.every(p => p.collected);
    if (allCollected && exitZone.active) {
        let distToExit = Math.hypot(player.x - exitZone.x, player.y - exitZone.y);
        if (distToExit < player.radius + exitZone.radius) {
            clearInterval(timerInterval);
            document.getElementById('winText').innerText = `Taso ${level} läpäisty!`;
            document.getElementById('winScreen').classList.remove('hidden');
        }
    }
}

function normalizeAngle(angle) {
    while (angle > Math.PI) angle -= Math.PI * 2;
    while (angle < -Math.PI) angle += Math.PI * 2;
    return angle;
}

function draw() {
    ctx.fillStyle = '#090916';
    ctx.fillRect(0, 0, WIDTH, HEIGHT);

    // Kunnon rakennukset ja seinät
    ctx.fillStyle = '#1e1b4b';
    ctx.strokeStyle = '#3b82f6';
    ctx.lineWidth = 2;
    walls.forEach(w => {
        ctx.fillRect(w.x, w.y, w.w, w.h);
        ctx.strokeRect(w.x, w.y, w.w, w.h);
    });

    // Vartijoiden valokeilat
    guards.forEach(g => {
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(g.x, g.y);
        ctx.arc(g.x, g.y, g.length, g.angle - g.spread / 2, g.angle + g.spread / 2);
        ctx.lineTo(g.x, g.y);
        ctx.fillStyle = 'rgba(255, 0, 85, 0.12)';
        ctx.fill();
        ctx.restore();

        ctx.fillStyle = g.color;
        ctx.beginPath();
        ctx.arc(g.x, g.y, g.radius, 0, Math.PI * 2);
        ctx.fill();
    });

    // Paketit
    packages.forEach(pkg => {
        if (!pkg.collected) {
            ctx.fillStyle = '#f59e0b';
            ctx.shadowBlur = 12;
            ctx.shadowColor = '#f59e0b';
            ctx.fillRect(pkg.x - pkg.radius, pkg.y - pkg.radius, pkg.radius * 2, pkg.radius * 2);
            ctx.shadowBlur = 0;
        }
    });

    // Maali
    let allCollected = packages.every(p => p.collected);
    ctx.fillStyle = allCollected ? '#10b981' : '#334155';
    ctx.shadowBlur = allCollected ? 15 : 0;
    ctx.shadowColor = '#10b981';
    ctx.beginPath();
    ctx.arc(exitZone.x, exitZone.y, exitZone.radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;

    // Pelaaja ja skinit (Näkkäri on suorakulmio / leipä)
    let skinColor = skins[equippedSkin].color;
    ctx.fillStyle = skinColor;
    ctx.shadowBlur = 15;
    ctx.shadowColor = skinColor;
    if (equippedSkin === 'nakkari') {
        ctx.fillRect(player.x - 16, player.y - 10, 32, 20);
    } else {
        ctx.beginPath();
        ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.shadowBlur = 0;

    // Joystick
    if (joystick.active) {
        ctx.beginPath();
        ctx.arc(joystick.startX, joystick.startY, joystick.radius, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
        ctx.fill();
        ctx.strokeStyle = 'rgba(0, 240, 255, 0.25)';
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(joystick.x, joystick.y, 22, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(0, 240, 255, 0.6)';
        ctx.fill();
    }

    // HUD yläpalkki
    ctx.fillStyle = '#f8fafc';
    ctx.font = 'bold 15px sans-serif';
    ctx.textAlign = 'left';
    let levelText = (level % 10 === 0) ? `BOSS-Taso ${level}` :
