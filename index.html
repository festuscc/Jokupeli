<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shadow Delivery</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            background: #09090b;
            color: #f4f4f5;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        canvas {
            background: #18181b;
            display: block;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
            border-radius: 12px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const WIDTH = 400;
const HEIGHT = 600;
canvas.width = WIDTH;
canvas.height = HEIGHT;

// Responsoiva skaalaus mobiilille
function resize() {
    const scale = Math.min(window.innerWidth / WIDTH, window.innerHeight / HEIGHT);
    canvas.style.width = WIDTH * scale + 'px';
    canvas.style.height = HEIGHT * scale + 'px';
}
window.addEventListener('resize', resize);
resize();

// Pelitilat
const STATES = { START: 0, PLAYING: 1, GAMEOVER: 2 };
let gameState = STATES.START;

let score = 0;
let highScore = localStorage.getItem('shadowDeliveryHighscore') || 0;

// Pelaaja (Kuriiri)
let player = {
    x: WIDTH / 2,
    y: HEIGHT - 80,
    radius: 14,
    speed: 3.5,
    color: '#38bdf8'
};

// Ohjausmuuttujat
let targetX = player.x;
let targetY = player.y;
let isMoving = false;

// Kohdepaketti, joka täytyy kerätä
let packageObj = {
    x: 0,
    y: 0,
    radius: 12,
    active: false
};

// Valokeilat (vältettävät vaarat)
let searchlights = [];

function resetGame() {
    score = 0;
    player.x = WIDTH / 2;
    player.y = HEIGHT - 80;
    targetX = player.x;
    targetY = player.y;
    isMoving = false;
    spawnPackage();
    initSearchlights();
}

function initSearchlights() {
    searchlights = [
        { x: 100, y: 150, angle: 0, speed: 0.03, length: 140, spread: 0.6 },
        { x: 300, y: 300, angle: Math.PI, speed: -0.025, length: 160, spread: 0.5 }
    ];
}

function spawnPackage() {
    packageObj.x = 50 + Math.random() * (WIDTH - 100);
    packageObj.y = 80 + Math.random() * 200;
    packageObj.active = true;
}

// Kosketus / Hiiriohjaus (Klikkaa tai vedä siirtääksesi hahmoa varoen)
function handlePointer(e) {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    
    targetX = (clientX - rect.left) * (WIDTH / rect.width);
    targetY = (clientY - rect.top) * (HEIGHT / rect.height);
    isMoving = true;

    if (gameState === STATES.START || gameState === STATES.GAMEOVER) {
        resetGame();
        gameState = STATES.PLAYING;
    }
}

window.addEventListener('pointerdown', handlePointer);
window.addEventListener('pointermove', (e) => {
    if (gameState === STATES.PLAYING && e.buttons > 0) {
        handlePointer(e);
    }
});

function update() {
    if (gameState !== STATES.PLAYING) return;

    // Liikuta pelaajaa kohti kohdetta pehmeästi
    if (isMoving) {
        let dx = targetX - player.x;
        let dy = targetY - player.y;
        let dist = Math.hypot(dx, dy);

        if (dist > 2) {
            player.x += (dx / dist) * player.speed;
            player.y += (dy / dist) * player.speed;
        }
    }

    // Rajat
    player.x = Math.max(player.radius, Math.min(WIDTH - player.radius, player.x));
    player.y = Math.max(player.radius, Math.min(HEIGHT - player.radius, player.y));

    // Päivitä valokeilat
    searchlights.forEach(sl => {
        sl.angle += sl.speed;
    });

    // Tarkista osuuko valokeila pelaajaan (Valo on vaara!)
    searchlights.forEach(sl => {
        // Lasketaanko pelaaja valokeilan sisään
        let dx = player.x - sl.x;
        let dy = player.y - sl.y;
        let dist = Math.hypot(dx, dy);

        if (dist < sl.length) {
            let angleToPlayer = Math.atan2(dy, dx);
            // Kulman erotuksen tarkistus valokeilan suuntaan
            let angleDiff = Math.abs(normalizeAngle(angleToPlayer - sl.angle));
            if (angleDiff < sl.spread / 2) {
                // Valo osui! Peli ohi
                gameOver();
            }
        }
    });

    // Tarkista paketin keräys
    if (packageObj.active) {
        let distToPkg = Math.hypot(player.x - packageObj.x, player.y - packageObj.y);
        if (distToPkg < player.radius + packageObj.radius) {
            score += 10;
            spawnPackage();
            // Vaikeuta peliä hieman lisäämällä uusi valokeila tai nopeutta
            if (score % 30 === 0 && searchlights.length < 4) {
                searchlights.push({
                    x: Math.random() * WIDTH,
                    y: 200 + Math.random() * 200,
                    angle: Math.random() * Math.PI,
                    speed: (Math.random() - 0.5) * 0.04,
                    length: 130,
                    spread: 0.5
                });
            }
        }
    }
}

function normalizeAngle(angle) {
    while (angle > Math.PI) angle -= Math.PI * 2;
    while (angle < -Math.PI) angle += Math.PI * 2;
    return angle;
}

function gameOver() {
    gameState = STATES.GAMEOVER;
    if (score > highScore) {
        highScore = score;
        localStorage.setItem('shadowDeliveryHighscore', highScore);
    }
}

function draw() {
    ctx.clearRect(0, 0, WIDTH, HEIGHT);

    // Piirrä kaupungin varjotausta
    ctx.fillStyle = '#18181b';
    ctx.fillRect(0, 0, WIDTH, HEIGHT);

    // Piirrä vaaralliset valokeilat (kelta/valkoinen hohde)
    searchlights.forEach(sl => {
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(sl.x, sl.y);
        ctx.arc(sl.x, sl.y, sl.length, sl.angle - sl.spread / 2, sl.angle + sl.spread / 2);
        ctx.lineTo(sl.x, sl.y);
        ctx.fillStyle = 'rgba(250, 204, 21, 0.15)';
        ctx.fill();
        ctx.restore();

        // Valonlähde
        ctx.fillStyle = '#facc15';
        ctx.beginPath();
        ctx.arc(sl.x, sl.y, 6, 0, Math.PI * 2);
        ctx.fill();
    });

    // Piirrä toimitettava paketti
    if (packageObj.active && gameState === STATES.PLAYING) {
        ctx.fillStyle = '#f43f5e';
        ctx.shadowBlur = 10;
        ctx.shadowColor = '#f43f5e';
        ctx.fillRect(packageObj.x - packageObj.radius, packageObj.y - packageObj.radius, packageObj.radius * 2, packageObj.radius * 2);
        ctx.shadowBlur = 0;
    }

    // Piirrä pelaaja (kuriiri)
    ctx.fillStyle = player.color;
    ctx.shadowBlur = 12;
    ctx.shadowColor = player.color;
    ctx.beginPath();
    ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;

    // Pisteet pelin aikana
    if (gameState === STATES.PLAYING || gameState === STATES.GAMEOVER) {
        ctx.fillStyle = '#f4f4f5';
        ctx.font = 'bold 20px sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText(`Toimitukset: ${score}`, 20, 35);
    }

    // Aloitusruutu
    if (gameState === STATES.START) {
        ctx.fillStyle = 'rgba(9, 9, 11, 0.85)';
        ctx.fillRect(0, 0, WIDTH, HEIGHT);

        ctx.fillStyle = '#38bdf8';
        ctx.font = 'bold 32px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('SHADOW DELIVERY', WIDTH / 2, HEIGHT / 2 - 60);

        ctx.fillStyle = '#a1a1aa';
        ctx.font = '16px sans-serif';
        ctx.fillText('Vältä valokeiloja, kerää paketit!', WIDTH / 2, HEIGHT / 2 - 15);

        ctx.fillStyle = '#f4f4f5';
        ctx.font = 'bold 16px sans-serif';
        ctx.fillText('Napauta aloittaaksesi', WIDTH / 2, HEIGHT / 2 + 50);

        ctx.fillStyle = '#71717a';
        ctx.font = '14px sans-serif';
        ctx.fillText(`Ennätys: ${highScore}`, WIDTH / 2, HEIGHT / 2 + 90);
    }

    // Game Over -ruutu
    if (gameState === STATES.GAMEOVER) {
        ctx.fillStyle = 'rgba(9, 9, 11, 0.9)';
        ctx.fillRect(0, 0, WIDTH, HEIGHT);

        ctx.fillStyle = '#f43f5e';
        ctx.font = 'bold 32px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('VALO OSSI!', WIDTH / 2, HEIGHT / 2 - 50);

        ctx.fillStyle = '#f4f4f5';
        ctx.font = '18px sans-serif';
        ctx.fillText(`Toimitukset yhteensä: ${score}`, WIDTH / 2, HEIGHT / 2);
        ctx.fillText(`Ennätys: ${highScore}`, WIDTH / 2, HEIGHT / 2 + 35);

        ctx.fillStyle = '#38bdf8';
        ctx.font = 'bold 16px sans-serif';
        ctx.fillText('Napauta yrittääksesi uudelleen', WIDTH / 2, HEIGHT / 2 + 90);
    }
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
