<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Jump</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            background: #111;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            background: #1a1a2e;
            display: block;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.2);
            cursor: pointer;
        }
    </style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// Responsoiva pelikenttä (sopii mobiilille)
const WIDTH = 400;
const HEIGHT = 600;
canvas.width = WIDTH;
canvas.height = HEIGHT;

// Skaalaa canvas täyttämään näytön järkevästi mobiilissa säilyttäen mittasuhteet
function resize() {
    const scale = Math.min(window.innerWidth / WIDTH, window.innerHeight / HEIGHT);
    canvas.style.width = WIDTH * scale + 'px';
    canvas.style.height = HEIGHT * scale + 'px';
}
window.addEventListener('resize', resize);
resize();

// Pelitilat
const STATES = { START: 0, PLAYING: 1, GAMEOVER: 2 };
let gameState = STATES.START;

// Pisteet & Tallennus (localStorage)
let score = 0;
let highScore = localStorage.getItem('neonJumpHighScore') || 0;

// Pelaaja
let player = {
    x: WIDTH / 2 - 15,
    y: HEIGHT - 150,
    width: 30,
    height: 30,
    vy: 0,
    jumpForce: -11,
    gravity: 0.45,
    color: '#00ffcc'
};

// Esteet (putoavat tai ohitettavat neon-laatikot)
let obstacles = [];
let spawnTimer = 0;
let spawnInterval = 70; // Ruutujen väli
let gameSpeed = 3;

// Hiiri / Kosketusohjaus
function handleInput(e) {
    if (e) e.preventDefault(); // Estää oletusselaimen eleet (kuten zoomauksen)

    if (gameState === STATES.START || gameState === STATES.GAMEOVER) {
        resetGame();
        gameState = STATES.PLAYING;
    } else if (gameState === STATES.PLAYING) {
        // Hypätään vain jos pelaaja on lähellä maata/alustaa (tai aina, tekee pelistä dynaamisen)
        player.vy = player.jumpForce;
    }
}

window.addEventListener('touchstart', handleInput, { passive: false });
window.addEventListener('mousedown', handleInput);

function resetGame() {
    score = 0;
    obstacles = [];
    gameSpeed = 3;
    spawnInterval = 70;
    player.y = HEIGHT - 150;
    player.vy = 0;
}

function update() {
    if (gameState !== STATES.PLAYING) return;

    // Fysiikka
    player.vy += player.gravity;
    player.y += player.vy;

    // Maan ja katon rajat
    if (player.y + player.height > HEIGHT - 50) {
        player.y = HEIGHT - 50 - player.height;
        player.vy = player.jumpForce * 0.7; // Pieni pomppu maasta
    }
    if (player.y < 0) {
        player.y = 0;
        player.vy = 0;
    }

    // Esteiden luonti
    spawnTimer++;
    if (spawnTimer >= spawnInterval) {
        spawnTimer = 0;
        let obsWidth = 50 + Math.random() * 80;
        let isTop = Math.random() < 0.5;
        obstacles.push({
            x: WIDTH,
            y: isTop ? 50 : HEIGHT - 90,
            width: obsWidth,
            height: 20,
            passed: false
        });
    }

    // Esteiden liike ja törmäykset
    for (let i = obstacles.length - 1; i >= 0; i--) {
        let obs = obstacles[i];
        obs.x -= gameSpeed;

        // Pisteiden lasku
        if (!obs.passed && obs.x + obs.width < player.x) {
            score += 10;
            obs.passed = true;
            // Vaikeustason nosto
            if (score % 50 === 0) {
                gameSpeed += 0.4;
                if (spawnInterval > 40) spawnInterval -= 3;
            }
        }

        // Törmäystarkistus (AABB)
        if (
            player.x < obs.x + obs.width &&
            player.x + player.width > obs.x &&
            player.y < obs.y + obs.height &&
            player.y + player.height > obs.y
        ) {
            gameOver();
        }

        // Poista ruudun ulkopuolelle menneet
        if (obs.x + obs.width < 0) {
            obstacles.splice(i, 1);
        }
    }
}

function gameOver() {
    gameState = STATES.GAMEOVER;
    if (score > highScore) {
        highScore = score;
        localStorage.setItem('neonJumpHighScore', highScore);
    }
}

function draw() {
    // Tyhjennä ruutu
    ctx.clearRect(0, 0, WIDTH, HEIGHT);

    // Piirrä lattia ja katto
    ctx.fillStyle = '#00ffcc';
    ctx.shadowBlur = 10;
    ctx.shadowColor = '#00ffcc';
    ctx.fillRect(0, HEIGHT - 50, WIDTH, 4);
    ctx.fillRect(0, 46, WIDTH, 4);
    ctx.shadowBlur = 0; // Nollaa varjo suorituskyvyn vuoksi

    // Piirrä esteet
    ctx.fillStyle = '#ff0055';
    ctx.shadowBlur = 8;
    ctx.shadowColor = '#ff0055';
    for (let obs of obstacles) {
        ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
    }
    ctx.shadowBlur = 0;

    // Piirrä pelaaja
    ctx.fillStyle = player.color;
    ctx.shadowBlur = 12;
    ctx.shadowColor = player.color;
    ctx.fillRect(player.x, player.y, player.width, player.height);
    ctx.shadowBlur = 0;

    // Piirrä pisteet pelin aikana
    if (gameState === STATES.PLAYING || gameState === STATES.GAMEOVER) {
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 24px sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText(`Pisteet: ${score}`, 20, 35);
    }

    // Aloitusruutu
    if (gameState === STATES.START) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
        ctx.fillRect(0, 0, WIDTH, HEIGHT);

        ctx.fillStyle = '#00ffcc';
        ctx.font = 'bold 36px sans-serif';
        ctx.textAlign = 'center';
        ctx.shadowBlur = 15;
        ctx.shadowColor = '#00ffcc';
        ctx.fillText('NEON JUMP', WIDTH / 2, HEIGHT / 2 - 50);
        ctx.shadowBlur = 0;

        ctx.fillStyle = '#fff';
        ctx.font = '18px sans-serif';
        ctx.fillText('Napauta näyttöä hypätäksesi', WIDTH / 2, HEIGHT / 2 + 10);
        
        ctx.fillStyle = '#888';
        ctx.font = '14px sans-serif';
        ctx.fillText(`Ennätys: ${highScore}`, WIDTH / 2, HEIGHT / 2 + 50);
    }

    // Game Over -ruutu
    if (gameState === STATES.GAMEOVER) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
        ctx.fillRect(0, 0, WIDTH, HEIGHT);

        ctx.fillStyle = '#ff0055';
        ctx.font = 'bold 36px sans-serif';
        ctx.textAlign = 'center';
        ctx.shadowBlur = 15;
        ctx.shadowColor = '#ff0055';
        ctx.fillText('PELI OHI', WIDTH / 2, HEIGHT / 2 - 60);
        ctx.shadowBlur = 0;

        ctx.fillStyle = '#fff';
        ctx.font = '20px sans-serif';
        ctx.fillText(`Pisteet: ${score}`, WIDTH / 2, HEIGHT / 2 - 10);
        ctx.fillText(`Ennätys: ${highScore}`, WIDTH / 2, HEIGHT / 2 + 25);

        ctx.fillStyle = '#00ffcc';
        ctx.font = 'bold 16px sans-serif';
        ctx.fillText('Napauta pelataksesi uudelleen', WIDTH / 2, HEIGHT / 2 + 80);
    }
}

// Pelisilmuli
function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

// Käynnistä peli
loop();
</script>

</body>
  </html>
