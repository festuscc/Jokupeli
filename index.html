<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shadow Delivery - Ultimate Edition</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        body {
            margin: 0;
            padding: 0;
            background: #09090b;
            color: #f4f4f5;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        canvas {
            background: #121215;
            display: block;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
            border-radius: 12px;
        }
    </style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const WIDTH = 400;
const HEIGHT = 600;
canvas.width = WIDTH;
canvas.height = HEIGHT;

function resize() {
    const scale = Math.min(window.innerWidth / WIDTH, window.innerHeight / HEIGHT);
    canvas.style.width = WIDTH * scale + 'px';
    canvas.style.height = HEIGHT * scale + 'px';
}
window.addEventListener('resize', resize);
resize();

// Pelitilat
const STATES = { TUTORIAL: 0, PLAYING: 1, SHOP: 2, GAMEOVER: 3, WIN: 4 };
let gameState = STATES.TUTORIAL;

// Tallennusmuuttujat (localStorage)
let level = parseInt(localStorage.getItem('sd_level')) || 1;
let coins = parseInt(localStorage.getItem('sd_coins')) || 0;
let speedLevel = parseInt(localStorage.getItem('sd_speedLvl')) || 1;
let unlockedSkins = JSON.parse(localStorage.getItem('sd_skins')) || ['default'];
let equippedSkin = localStorage.getItem('sd_equipped') || 'default';

// Pelaaja
let player = {
    x: 50,
    y: 520,
    radius: 12,
    get speed() { return 2.8 + (speedLevel * 0.4); }
};

// Joystick
let joystick = {
    active: false,
    pointerId: null,
    startX: 0,
    startY: 0,
    x: 0,
    y: 0,
    forceX: 0,
    forceY: 0,
    radius: 45
};

let walls = [];
let guards = [];
let packages = [];
let exitZone = { x: 330, y: 520, radius: 25, active: false };

// Skinien määritykset
const skins = {
    'default': { name: 'Perus Sininen', color: '#38bdf8', price: 0 },
    'neon': { name: 'Neon Vihreä', color: '#10b981', price: 50 },
    'gold': { name: 'Kultainen', color: '#f59e0b', price: 100 },
    'nakkari': { name: 'Näkkäri 🍞', color: '#d4a373', price: 999, secret: true }
};

function saveGameData() {
    localStorage.setItem('sd_level', level);
    localStorage.setItem('sd_coins', coins);
    localStorage.setItem('sd_speedLvl', speedLevel);
    localStorage.setItem('sd_skins', JSON.stringify(unlockedSkins));
    localStorage.setItem('sd_equipped', equippedSkin);
}

function loadLevel(lvl) {
    walls = [];
    guards = [];
    packages = [];

    // Mitä pidemmälle päästään, sitä enemmän seiniä, paketteja ja vartijoita
    let guardCount = Math.min(1 + Math.floor(lvl / 2), 4);
    let pkgCount = Math.min(1 + Math.floor(lvl / 3), 3);

    // Satunnaistetaan hieman rakenteita tason mukaan
    if (lvl === 1) {
        walls = [{ x: 120, y: 150, w: 30, h: 250 }, { x: 240, y: 200, w: 30, h: 250 }];
    } else {
        walls = [
            { x: 80, y: 120, w: 100, h: 25 },
            { x: 220, y: 280, w: 100, h: 25 },
            { x: 140, y: 400, w: 120, h: 25 }
        ];
    }

    // Luodaan vartijat omilla skineillä / väreillä
    const guardColors = ['#ef4444', '#ec4899', '#8b5cf6', '#f97316'];
    for (let i = 0; i < guardCount; i++) {
        guards.push({
            x: 80 + i * 80,
            y: 100 + i * 110,
            vx: (i % 2 === 0 ? 2 : -2) * (1 + lvl * 0.1),
            minX: 40,
            maxX: 360,
            radius: 10,
            angle: i * Math.PI / 2,
            spread: 0.5,
            length: 110,
            color: guardColors[i % guardColors.length]
        });
    }

    // Luodaan paketit kerättäväksi
    for (let i = 0; i < pkgCount; i++) {
        packages.push({
            x: 100 + (i * 100),
            y: 70 + (i * 80),
            radius: 10,
            collected: false
        });
    }

    exitZone = { x: 350, y: 520, radius: 22, active: false };
    player.x = 50; 
    player.y = 520;
}

// Ohjaus & Klikkaukset
canvas.addEventListener('pointerdown', (e) => {
    const rect = canvas.getBoundingClientRect();
    const clientX = e.clientX - rect.left;
    const clientY = e.clientY - rect.top;

    if (gameState === STATES.TUTORIAL) {
        gameState = STATES.PLAYING;
        loadLevel(level);
        return;
    }

    if (gameState === STATES.SHOP) {
        handleShopClick(clientX, clientY);
        return;
    }

    if (gameState === STATES.GAMEOVER || gameState === STATES.WIN) {
        if (gameState === STATES.WIN) level = 1;
        gameState = STATES.PLAYING;
        loadLevel(level);
        return;
    }

    // Joystick aktivointi
    if (!joystick.active) {
        joystick.active = true;
        joystick.pointerId = e.pointerId;
        joystick.startX = clientX;
        joystick.startY = clientY;
        joystick.x = clientX;
        joystick.y = clientY;
        joystick.forceX = 0;
        joystick.forceY = 0;
        canvas.setPointerCapture(e.pointerId);
    }
});

canvas.addEventListener('pointermove', (e) => {
    if (!joystick.active || e.pointerId !== joystick.pointerId || gameState !== STATES.PLAYING) return;
    const rect = canvas.getBoundingClientRect();
    const clientX = e.clientX - rect.left;
    const clientY = e.clientY - rect.top;

    let dx = clientX - joystick.startX;
    let dy = clientY - joystick.startY;
    let dist = Math.hypot(dx, dy);

    if (dist > joystick.radius) {
        dx = (dx / dist) * joystick.radius;
        dy = (dy / dist) * joystick.radius;
    }

    joystick.x = joystick.startX + dx;
    joystick.y = joystick.startY + dy;
    joystick.forceX = dx / joystick.radius;
    joystick.forceY = dy / joystick.radius;
});

function endJoystick(e) {
    if (joystick.active && e.pointerId === joystick.pointerId) {
        joystick.active = false;
        joystick.pointerId = null;
        joystick.forceX = 0;
        joystick.forceY = 0;
    }
}
canvas.addEventListener('pointerup', endJoystick);
canvas.addEventListener('pointercancel', endJoystick);

function handleShopClick(x, y) {
    // Nopeuspäivitys nappi
    if (x > 50 && x < 350 && y > 160 && y < 210) {
        let cost = speedLevel * 25;
        if (coins >= cost) {
            coins -= cost;
            speedLevel++;
            saveGameData();
        }
    }

    // Skinit: Neon
    if (x > 50 && x < 190 && y > 260 && y < 310) {
        buyOrEquipSkin('neon');
    }
    // Skinit: Gold
    if (x > 210 && x < 350 && y > 260 && y < 310) {
        buyOrEquipSkin('gold');
    }
    // Skinit: Näkkäri
    if (x > 50 && x < 190 && y > 330 && y < 380) {
        buyOrEquipSkin('nakkari');
    }

    // Admin-koodi nappi
    if (x > 210 && x < 350 && y > 330 && y < 380) {
        let code = prompt("Syötä Admin-koodi:");
        if (code && code.toUpperCase() === "NAKKARI") {
            if (!unlockedSkins.includes('nakkari')) unlockedSkins.push('nakkari');
            equippedSkin = 'nakkari';
            saveGameData();
            alert("Salainen Näkkäri-skini avattu! 🍞");
        } else if (code) {
            alert("Väärä koodi!");
        }
    }

    // Jatka seuraavaan tasoon nappi
    if (x > 100 && x < 300 && y > 470 && y < 530) {
        gameState = STATES.PLAYING;
        loadLevel(level);
    }
}

function buyOrEquipSkin(skinKey) {
    let skin = skins[skinKey];
    if (unlockedSkins.includes(skinKey)) {
        equippedSkin = skinKey;
    } else if (coins >= skin.price) {
        coins -= skin.price;
        unlockedSkins.push(skinKey);
        equippedSkin = skinKey;
    }
    saveGameData();
}

function checkWallCollision(nx, ny) {
    for (let w of walls) {
        if (
            nx + player.radius > w.x &&
            nx - player.radius < w.x + w.w &&
            ny + player.radius > w.y &&
            ny - player.radius < w.y + w.h
        ) {
            return true;
        }
    }
    return false;
}

function update() {
    if (gameState !== STATES.PLAYING) return;

    if (joystick.active) {
        let nextX = player.x + joystick.forceX * player.speed;
        let nextY = player.y + joystick.forceY * player.speed;

        if (!checkWallCollision(nextX, player.y)) player.x = nextX;
        if (!checkWallCollision(player.x, nextY)) player.y = nextY;
    }

    player.x = Math.max(player.radius, Math.min(WIDTH - player.radius, player.x));
    player.y = Math.max(player.radius, Math.min(HEIGHT - player.radius, player.y));

    // Vartijoiden liike
    guards.forEach(g => {
        g.x += g.vx;
        if (g.x < g.minX || g.x > g.maxX) g.vx *= -1;
        g.angle += 0.025;

        let dx = player.x - g.x;
        let dy = player.y - g.y;
        let dist = Math.hypot(dx, dy);

        if (dist < g.length) {
            let angleToPlayer = Math.atan2(dy, dx);
            let angleDiff = Math.abs(normalizeAngle(angleToPlayer - g.angle));
            if (angleDiff < g.spread / 2) {
                gameState = STATES.GAMEOVER;
            }
        }
    });

    // Pakettien keräys
    packages.forEach(pkg => {
        if (!pkg.collected) {
            let dist = Math.hypot(player.x - pkg.x, player.y - pkg.y);
            if (dist < player.radius + pkg.radius) {
                pkg.collected = true;
                coins += 10; // Ansaitse kolikoita paketista
                saveGameData();
                if (packages.every(p => p.collected)) {
                    exitZone.active = true;
                }
            }
        }
    });

    // Maaliin pääsy -> Siirry kauppaan!
    let allCollected = packages.every(p => p.collected);
    if (allCollected && exitZone.active) {
        let distToExit = Math.hypot(player.x - exitZone.x, player.y - exitZone.y);
        if (distToExit < player.radius + exitZone.radius) {
            level++;
            saveGameData();
            gameState = STATES.SHOP; // Avataan tason välissä kauppa!
        }
    }
}

function normalizeAngle(angle) {
    while (angle > Math.PI) angle -= Math.PI * 2;
    while (angle < -Math.PI) angle += Math.PI * 2;
    return angle;
}

function draw() {
    ctx.clearRect(0, 0, WIDTH, HEIGHT);

    if (gameState === STATES.PLAYING || gameState === STATES.GAMEOVER) {
        // Seinät
        ctx.fillStyle = '#27272a';
        ctx.strokeStyle = '#3f3f46';
        ctx.lineWidth = 2;
        walls.forEach(w => {
            ctx.fillRect(w.x, w.y, w.w, w.h);
            ctx.strokeRect(w.x, w.y, w.w, w.h);
        });

        // Vartijat ja heidän skinit/värit
        guards.forEach(g => {
            ctx.save();
            ctx.beginPath();
            ctx.moveTo(g.x, g.y);
            ctx.arc(g.x, g.y, g.length, g.angle - g.spread / 2, g.angle + g.spread / 2);
            ctx.lineTo(g.x, g.y);
            ctx.fillStyle = 'rgba(239, 68, 68, 0.15)';
            ctx.fill();
            ctx.restore();

            ctx.fillStyle = g.color;
            ctx.beginPath();
            ctx.arc(g.x, g.y, g.radius, 0, Math.PI * 2);
            ctx.fill();
        });

        // Paketit
        packages.forEach(pkg => {
            if (!pkg.collected) {
                ctx.fillStyle = '#f59e0b';
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#f59e0b';
                ctx.fillRect(pkg.x - pkg.radius, pkg.y - pkg.radius, pkg.radius * 2, pkg.radius * 2);
                ctx.shadowBlur = 0;
            }
        });

        // Maali
        let allCollected = packages.every(p => p.collected);
        ctx.fillStyle = allCollected ? '#10b981' : '#3f3f46';
        ctx.beginPath();
        ctx.arc(exitZone.x, exitZone.y, exitZone.radius, 0, Math.PI * 2);
        ctx.fill();

        // Pelaaja ja sen skini (Näkkäri piirretään hauskasti ruskeana ruudulla)
        let skinColor = skins[equippedSkin].color;
        ctx.fillStyle = skinColor;
        ctx.shadowBlur = 12;
        ctx.shadowColor = skinColor;
        if (equippedSkin === 'nakkari') {
            ctx.fillRect(player.x - player.radius, player.y - player.radius, player.radius * 2, player.radius * 2);
        } else {
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.shadowBlur = 0;

        // Joystick
        if (joystick.active) {
            ctx.beginPath();
            ctx.arc(joystick.startX, joystick.startY, joystick.radius, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.08)';
            ctx.fill();
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(joystick.x, joystick.y, 22, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(56, 189, 248, 0.6)';
            ctx.fill();
        }

        // HUD / Yläpalkki
        ctx.fillStyle = '#f4f4f5';
        ctx.font = 'bold 15px sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText(`Taso: ${level} | Kolikot: 🪙 ${coins}`, 20, 30);
    }

    // KAUPPA-VALIKKO TASOJEN VÄLISSÄ
    if (gameState === STATES.SHOP) {
        ctx.fillStyle = 'rgba(9, 9, 11, 0.96)';
        ctx.fillRect(0, 0, WIDTH, HEIGHT);

        ctx.fillStyle = '#38bdf8';
        ctx.font = 'bold 26px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('PÄIVITYSKKAUPPA', WIDTH / 2, 60);

        ctx.fillStyle = '#f59e0b';
        ctx.font = '16px sans-serif';
        ctx.fillText(`Kolikot: 🪙 ${coins}`, WIDTH / 2, 95);

        // Nopeuspäivitys-nappi
        ctx.fillStyle = '#1e1b4b';
        ctx.strokeStyle = '#3b82f6';
        ctx.lineWidth = 2;
        ctx.fillRect(50, 150, 300, 50);
        ctx.strokeRect(50, 150, 300, 50);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 14px sans-serif';
        let speedCost = speedLevel * 25;
        ctx.fillText(`Päivitä nopeus (Taso ${speedLevel}): ${speedCost}🪙`, WIDTH / 2, 180);

        // Skinit nappien piirrot
        drawShopButton(50, 250, 140, 50, 'Neon Vihreä', 'neon');
        drawShopButton(210, 250, 140, 50, 'Kultainen', 'gold');
        drawShopButton(50, 320, 140, 50, 'Näkkäri 🍞', 'nakkari');

        // Admin-koodi nappi
        ctx.fillStyle = '#3f3f46';
        ctx.fillRect(210, 320, 140, 50);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 13px sans-serif';
        ctx.fillText('Admin Koodi 🔑', 280, 350);

        // Seuraava taso -nappi
        ctx.fillStyle = '#10b981';
        ctx.fillRect(80, 460, 240, 60);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 18px sans-serif';
        ctx.fillText('JATKA SEURAAVAAN TASOON', WIDTH / 2, 495);
    }

    // Tutoriaali
    if (gameState === STATES.TUTORIAL) {
        ctx.fillStyle = 'rgba(9, 9, 11, 0.95)';
        ctx.fillRect(0, 0, WIDTH, HEIGHT);

        ctx.fillStyle = '#38bdf8';
        ctx.font = 'bold 26px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('SHADOW DELIVERY', WIDTH / 2, HEIGHT / 2 - 100);

        ctx.fillStyle = '#d4d4d8';
        ctx.font = '14px sans-serif';
        ctx.fillText('1. Liiku raahaamalla näyttöä.', WIDTH / 2, HEIGHT / 2 - 40);
        ctx.fillText('2. Vältä vartijoiden valoja ja kerää paketit.', WIDTH / 2, HEIGHT / 2 - 10);
        ctx.fillText('3. Osta skinejä ja parannuksia tasojen välissä!', WIDTH / 2, HEIGHT / 2 + 20);

        ctx.fillStyle = '#f4f4f5';
        ctx.font = 'bold 16px sans-serif';
        ctx.fillText('Napauta aloittaaksesi', WIDTH / 2, HEIGHT / 2 + 90);
    }

    // Game Over
    if (gameState === STATES.GAMEOVER) {
        ctx.fillStyle = 'rgba(9, 9, 11, 0.9)';
        ctx.fillRect(0, 0, WIDTH, HEIGHT);

        ctx.fillStyle = '#ef4444';
        ctx.font = 'bold 30px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('VALO OSI!', WIDTH / 2, HEIGHT / 2 - 30);

        ctx.fillStyle = '#38bdf8';
        ctx.font = 'bold 16px sans-serif';
        ctx.fillText('Napauta yrittääksesi uudelleen', WIDTH / 2, HEIGHT / 2 + 30);
    }
}

function drawShopButton(x, y, w, h, label, skinKey) {
    let isUnlocked = unlockedSkins.includes(skinKey);
    let isEquipped = equippedSkin === skinKey;

    ctx.fillStyle = isEquipped ? '#10b981' : (isUnlocked ? '#3b82f6' : '#27272a');
    ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = '#52525b';
    ctx.strokeRect(x, y, w, h);

    ctx.fillStyle = '#fff';
    ctx.font = 'bold 13px sans-serif';
    ctx.textAlign = 'center';
    let text = isEquipped ? `${label} (Käytössä)` : (isUnlocked ? `${label}` : `${label} (${skins[skinKey].price}🪙)`);
    ctx.fillText(text, x + w / 2, y + 30);
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
